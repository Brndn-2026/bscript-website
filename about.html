    <section id="introduction">
        <h2>About BScript</h2>
        <p>BScript is a very simple scripting language.</p>
        <p>It is very simple even loopin is. Here's an example code : <code>repeat 10 print hello world</code></p>
        <p>Currently the version is: <span id="version-container">Loading...</span></p>
    
        <script>
        // Fetch the version from the bscript repository
            fetch('https://cdn.jsdelivr.net/gh/Brndn-2026/bscript@main/version.txt')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text();
                })
                .then(version => {
                // Safely update only the version text placeholder, trimming any extra whitespace
                    document.getElementById('version-container').textContent = version.trim();
                })
                .catch(error => {
                    console.error('Error fetching version:', error);
                    document.getElementById('version-container').textContent = 'Unable to fetch version';
                });
    </script>
</section>

<script>
        fetch('https://cdn.jsdelivr.net/gh/Brndn-2026/bscript-website@main/deployed.txt')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text();
                })
                .then(isdeployed => {
                // Safely update only the version text placeholder, trimming any extra whitespace
                    if (isdeployed.trim() === 'true') {
                        window.location.href = "https://brndn-2026.github.io/bscript-website/index.html";
                    } else {
                        window.location.href = "https://brndn-2026.github.io/bscript-website/notdeployed.html";
                    }
                })
                .catch(error => {
                    console.error('Error fetching version:', error);
                });
    </script>
